<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy</title>

  <!-- Usercentrics Privacy Policy Generator Script -->
  <script
    id="usercentrics-ppg"
    privacy-policy-id="77632c3d-bafc-4a00-b04c-20181feee0de"
    data-language="en"
    src="https://policygenerator.usercentrics.eu/api/privacy-policy"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #2d3748;
      background-color: #f7fafc;
      margin: 0;
      padding: 40px 16px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    }
    /* استایل اولیه در صورتی که لود شدن اسکریپت چند لحظه طول بکشد */
    .uc-privacy-policy:empty::before {
      content: "Loading Privacy Policy...";
      color: #718096;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- محتوای حریم خصوصی به صورت خودکار در این بخش بارگذاری می‌شود -->
    <div class="uc-privacy-policy"></div>
  </main>
</body>
</html>
